name: AQI Feature Pipeline

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: aqi-feature-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-features:
    runs-on: ubuntu-latest
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      AQI_LATITUDE: ${{ vars.AQI_LATITUDE || '31.4697' }}
      AQI_LONGITUDE: ${{ vars.AQI_LONGITUDE || '74.3984' }}
      AQI_LOCATION_LABEL: ${{ vars.AQI_LOCATION_LABEL || 'DHA Phase 4, Lahore, Pakistan' }}
      AQI_OUTPUT_DIR: data/processed
      AQI_RAW_DIR: data/raw
      AQI_FEATURE_STORE_DIR: data/feature_store
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pip install pytest
          pytest -q || true

      - name: Run feature pipeline
        run: python aqi_pipeline.py

      - name: Commit feature store updates
        run: |
          if git diff --quiet -- data/processed/feature_snapshot.csv data/feature_store/aqi_feature_table.csv; then
            echo "No feature changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/feature_snapshot.csv data/feature_store/aqi_feature_table.csv
          git commit -m "chore: update AQI feature store [skip ci]"
          git push

      - name: Upload feature artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqi-feature-output
          path: |
            data/processed/feature_snapshot.csv
            data/feature_store/aqi_feature_table.csv
          if-no-files-found: error
