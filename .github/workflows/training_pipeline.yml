name: AQI Training Pipeline

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

concurrency:
  group: aqi-training-pipeline
  cancel-in-progress: false

jobs:
  train-model:
    runs-on: ubuntu-latest
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      AQI_LATITUDE: ${{ vars.AQI_LATITUDE || '31.4697' }}
      AQI_LONGITUDE: ${{ vars.AQI_LONGITUDE || '74.3984' }}
      AQI_LOCATION_LABEL: ${{ vars.AQI_LOCATION_LABEL || 'DHA Phase 4, Lahore, Pakistan' }}
      AQI_OUTPUT_DIR: data/processed
      AQI_RAW_DIR: data/raw
      AQI_FEATURE_STORE_DIR: data/feature_store
      AQI_MODEL_REGISTRY_DIR: data/model_registry
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pip install pytest
          pytest -q || true

      - name: Refresh feature store snapshot
        run: python aqi_pipeline.py

      - name: Train and evaluate models
        run: python aqi_train.py

      - name: Upload model registry artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqi-model-registry
          path: data/model_registry/
          if-no-files-found: error
